name: Build Offline APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets
        run: npx cap copy android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Replace app icon with a real adaptive + light/dark + themed icon
        run: |
          set -e
          RES=android/app/src/main/res

          # Legacy flat icon (pre-Android 8 devices, which ignore adaptive-icon XML
          # entirely and can't react to theme -- so they just get the light version).
          LEGACY=www/icons/icon-512.png
          declare -A LEGACY_SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!LEGACY_SIZES[@]}"; do
            size=${LEGACY_SIZES[$density]}
            dir=$RES/mipmap-$density
            mkdir -p "$dir"
            convert "$LEGACY" -resize ${size}x${size} "$dir/ic_launcher.png"
            convert "$LEGACY" -resize ${size}x${size} "$dir/ic_launcher_round.png"
          done

          # IMPORTANT: delete the template's own placeholder background/foreground
          # (an unqualified resource like res/drawable/ic_launcher_foreground.xml is
          # treated by Android as a perfect density match, so it can silently outrank
          # a density-qualified replacement -- this is why "light mode" was showing
          # the stock Android robot instead of our icon). Wipe every copy of it,
          # across every folder the template might have put it in.
          find $RES -maxdepth 1 -type d \( -name 'drawable*' -o -name 'mipmap-anydpi*' \) | while read -r d; do
            rm -f "$d"/ic_launcher_background.* "$d"/ic_launcher_foreground.* "$d"/ic_launcher_monochrome.*
          done

          # Adaptive icon layers (Android 8+), shipped as plain `drawable` (day) and
          # `drawable-night` (night) -- no density qualifier, so there is exactly one
          # competing resource per config and ours always wins.
          mkdir -p $RES/drawable $RES/drawable-night
          convert www/icons/icon-background-light.png -resize 432x432 $RES/drawable/ic_launcher_background.png
          convert www/icons/icon-foreground-light.png  -resize 432x432 $RES/drawable/ic_launcher_foreground.png
          convert www/icons/icon-background-dark.png   -resize 432x432 $RES/drawable-night/ic_launcher_background.png
          convert www/icons/icon-foreground-dark.png   -resize 432x432 $RES/drawable-night/ic_launcher_foreground.png
          convert www/icons/icon-monochrome.png        -resize 432x432 $RES/drawable/ic_launcher_monochrome.png

          # Adaptive icon XML: composes the layers above; `monochrome` is what Android
          # 13+ uses for themed (wallpaper-tinted) icons, `background`/`foreground`
          # resolve to the day or night drawable automatically at runtime.
          rm -rf $RES/mipmap-anydpi-v26
          mkdir -p $RES/mipmap-anydpi-v26
          for name in ic_launcher ic_launcher_round; do
            cat > $RES/mipmap-anydpi-v26/$name.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          EOF
          done

      - name: Wire up the real Android 12+ splash screen (light/dark) + legacy fallback
        run: |
          set -e
          RES=android/app/src/main/res

          # Dedicated splash icon drawables (day + night), used by the modern
          # androidx SplashScreen API via windowSplashScreenAnimatedIcon below.
          mkdir -p $RES/drawable $RES/drawable-night
          convert www/icons/splash-light.png -resize 720x720 $RES/drawable/ic_launcher_splash_icon.png
          convert www/icons/splash-dark.png  -resize 720x720 $RES/drawable-night/ic_launcher_splash_icon.png

          # Background colors to go with them.
          mkdir -p $RES/values $RES/values-night
          LIGHT_HEX=$(convert www/icons/splash-light.png -format "%[pixel:p{2,2}]" info: | sed -E 's/srgba?\(([0-9]+),([0-9]+),([0-9]+).*/printf "#%02x%02x%02x" \1 \2 \3/e')
          DARK_HEX=$(convert www/icons/splash-dark.png -format "%[pixel:p{2,2}]" info: | sed -E 's/srgba?\(([0-9]+),([0-9]+),([0-9]+).*/printf "#%02x%02x%02x" \1 \2 \3/e')
          LIGHT_HEX=${LIGHT_HEX:-#EDECE9}
          DARK_HEX=${DARK_HEX:-#121216}

          python3 - "$LIGHT_HEX" "$DARK_HEX" <<'PY'
          import re, sys, glob, os

          light_hex, dark_hex = sys.argv[1], sys.argv[2]
          res = "android/app/src/main/res"

          def upsert_color(path, name, value):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              if os.path.exists(path):
                  content = open(path).read()
              else:
                  content = "<resources>\n</resources>\n"
              tag = f'<color name="{name}">{value}</color>'
              if f'name="{name}"' in content:
                  content = re.sub(rf'<color name="{name}">.*?</color>', tag, content)
              else:
                  content = content.replace("</resources>", f"    {tag}\n</resources>")
              open(path, "w").write(content)

          upsert_color(f"{res}/values/colors.xml", "splashBackground", light_hex)
          upsert_color(f"{res}/values-night/colors.xml", "splashBackground", dark_hex)

          # Find the launch theme (parent Theme.SplashScreen, or name containing
          # "Launch") in any values*/styles.xml or themes.xml and point its splash
          # attributes at our new drawable + color.
          candidates = glob.glob(f"{res}/values/styles.xml") + glob.glob(f"{res}/values/themes.xml") \
              + glob.glob(f"{res}/values-*/styles.xml") + glob.glob(f"{res}/values-*/themes.xml")

          patched = False
          for path in candidates:
              content = open(path).read()
              if "Theme.SplashScreen" not in content and "Launch" not in content:
                  continue

              def set_item(name, value, c=content):
                  pattern = rf'<item name="{name}">.*?</item>'
                  tag = f'<item name="{name}">{value}</item>'
                  if re.search(pattern, c):
                      return re.sub(pattern, tag, c)
                  return re.sub(r'(<style[^>]*Launch[^>]*>)', rf'\1\n        {tag}', c, count=1)

              content = set_item("windowSplashScreenBackground", "@color/splashBackground", content)
              content = set_item("windowSplashScreenAnimatedIcon", "@drawable/ic_launcher_splash_icon", content)
              open(path, "w").write(content)
              patched = True

          if not patched:
              print("WARNING: no splash theme found to patch -- check res/values/styles.xml manually")
          PY

          # Legacy fallback: pre-Android 12 devices (and the old cordova-style
          # static splash bitmap some templates still ship) use plain splash.png
          # files under res/drawable*/. Regenerate every one we find, day + night.
          mapfile -t splash_files < <(find $RES -type f -name 'splash.png')
          for f in "${splash_files[@]}"; do
            dims=$(identify -format '%wx%h' "$f")
            dir=$(dirname "$f")
            base=$(basename "$dir")

            if [[ "$base" == drawable-port-* || "$base" == drawable-land-* ]]; then
              night_base=${base/-port-/-port-night-}
              night_base=${night_base/-land-/-land-night-}
            elif [[ "$base" == "drawable" ]]; then
              night_base="drawable-night"
            else
              night_base=${base/drawable-/drawable-night-}
            fi
            night_dir=$(dirname "$dir")/$night_base
            mkdir -p "$night_dir"

            convert www/icons/splash-light.png -resize "${dims}^" -gravity center -extent "$dims" "$f"
            convert www/icons/splash-dark.png  -resize "${dims}^" -gravity center -extent "$dims" "$night_dir/splash.png"
          done

      - name: Inject immersive-mode MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/notesapp/offline
          cp MainActivity.java android/app/src/main/java/com/notesapp/offline/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
