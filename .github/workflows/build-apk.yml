name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject Custom MainActivity
        run: cp MainActivity.java android/app/src/main/java/com/notesapp/offline/MainActivity.java

      - name: Generate App Icons & Splash Screens
        run: npx capacitor-assets generate --android --splashBackgroundColor '#000000' --iconBackgroundColor '#000000'

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: The Ultimate Node.js Color Fix
        # This script physically injects the missing black background tag into Android's launch theme
        run: |
          cat << 'EOF' > fix.js
          const fs = require('fs');
          const path = require('path');
          
          function processDir(dir) {
            if (!fs.existsSync(dir)) return;
            fs.readdirSync(dir).forEach(file => {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                processDir(fullPath);
              } else if (fullPath.endsWith('.xml')) {
                let content = fs.readFileSync(fullPath, 'utf8');
                let original = content;
                
                // 1. Force ANY hex colors in colors.xml or background files to pitch black
                if (fullPath.includes('colors.xml') || fullPath.includes('ic_launcher_background.xml')) {
                  content = content.replace(/>#[0-9a-fA-F]{6,8}</g, '>#000000<');
                  content = content.replace(/"#[0-9a-fA-F]{6,8}"/g, '"#000000"');
                }
                
                // 2. Forcefully inject the black background into Android's Launch Theme
                if (fullPath.includes('styles.xml') && content.includes('AppTheme.NoActionBarLaunch')) {
                  // Replace it if it exists
                  content = content.replace(/<item name="windowSplashScreenBackground">[^<]+<\/item>/g, '<item name="windowSplashScreenBackground">#000000</item>');
                  content = content.replace(/<item name="android:windowSplashScreenBackground">[^<]+<\/item>/g, '<item name="android:windowSplashScreenBackground">#000000</item>');
                  
                  // Inject it if it is missing entirely (This is what caused the gray!)
                  if (!content.includes('name="windowSplashScreenBackground"')) {
                    content = content.replace(/(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)/, '$1\n        <item name="windowSplashScreenBackground">#000000</item>\n        <item name="android:windowSplashScreenBackground">#000000</item>');
                  }
                }
                
                if (content !== original) {
                  fs.writeFileSync(fullPath, content);
                  console.log('Fixed:', fullPath);
                }
              }
            });
          }
          processDir('android/app/src/main/res');
          EOF
          node fix.js

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
