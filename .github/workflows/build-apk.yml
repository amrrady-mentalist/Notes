name: Build Android APK

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses that name
  workflow_dispatch: # Allows you to manually trigger the build from GitHub's UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Inject Custom Icons into Native Android Resources
        run: |
          echo "Replacing default system icons with custom assets from www/icons..."
          
          # Create targets if they don't exist yet
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Force overwrite regular launcher icons
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          # Force overwrite round launcher icons
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Compile Standalone APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
