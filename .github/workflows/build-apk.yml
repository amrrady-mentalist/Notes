name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm install

      - name: Add Android Platform
        # Generates the native 'android' folder from scratch
        run: npx cap add android

      - name: Inject Custom MainActivity
        # Copies your custom magic Android tweaks over the default generated file
        run: cp MainActivity.java android/app/src/main/java/com/notesapp/offline/MainActivity.java

      - name: Generate App Icons & Splash Screens
        # This generates the assets and natively updates Android XML files (injecting the gray)
        run: npm run generate-assets

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Force Pitch Black Splash Screen (Moved here!)
        # Runs AFTER the icon generator, aggressively overwriting the gray with pitch black
        run: |
          find android/app/src/main/res -name "colors.xml" -type f -exec sed -i -E 's/>#[a-fA-F0-9]{6,8}</>#000000</g' {} +
          find android/app/src/main/res -name "variables.xml" -type f -exec sed -i -E 's/>#[a-fA-F0-9]{6,8}</>#000000</g' {} + || true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
