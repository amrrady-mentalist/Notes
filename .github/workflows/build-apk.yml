name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject Custom MainActivity
        run: cp MainActivity.java android/app/src/main/java/com/notesapp/offline/MainActivity.java

      - name: Generate App Icons & Splash Screens
        run: npm run generate-assets

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Nuke Android Colors to Pitch Black
        # Completely overwrites Android's native color files so no gray can survive
        run: |
          mkdir -p android/app/src/main/res/values-night
          cat <<EOF > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#000000</color>
              <color name="background">#000000</color>
              <color name="ic_launcher_background">#000000</color>
              <color name="splash_screen_background">#000000</color>
          </resources>
          EOF
          cp android/app/src/main/res/values/colors.xml android/app/src/main/res/values-night/colors.xml

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
