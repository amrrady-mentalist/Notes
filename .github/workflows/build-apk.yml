name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm install

      - name: Add Android Platform
        # Generates the native 'android' folder from scratch
        run: npx cap add android

      - name: Force Pitch Black Splash Screen
        # Overrides Android's native default dark-gray backgrounds to true pitch black
        run: |
          sed -i 's/>#FFFFFF</>#000000</g' android/app/src/main/res/values/colors.xml || true
          sed -i 's/>#121212</>#000000</g' android/app/src/main/res/values-night/colors.xml || true
          sed -i 's/>#1c1c1d</>#000000</g' android/app/src/main/res/values-night/colors.xml || true

      - name: Inject Custom MainActivity
        # Copies your custom magic Android tweaks over the default generated file
        run: cp MainActivity.java android/app/src/main/java/com/notesapp/offline/MainActivity.java

      - name: Generate App Icons
        run: npm run generate-assets

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
