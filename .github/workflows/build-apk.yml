name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject Custom MainActivity
        run: cp MainActivity.java android/app/src/main/java/com/notesapp/offline/MainActivity.java

      - name: Generate App Icons & Splash Screens
        # Splash background: pure white in light mode, pure black in dark mode.
        # Icon background stays pure black, unchanged.
        run: npx capacitor-assets generate --android --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#000000' --iconBackgroundColor '#000000'

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
