name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject Custom MainActivity
        run: cp MainActivity.java android/app/src/main/java/com/notesapp/offline/MainActivity.java

      - name: Generate App Icons & Splash Screens
        run: npx capacitor-assets generate --android --splashBackgroundColor '#000000' --iconBackgroundColor '#000000'

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Scorched Earth Pitch Black
        # Completely dismantles Android's icon and splash screen systems to force pure black
        run: |
          # 1. Force the Android 12+ Splash Screen API to black
          find android/app/src/main/res -name "styles.xml" -type f -exec sed -i -E 's/name="windowSplashScreenBackground">[^<]+/name="windowSplashScreenBackground">#000000/g' {} + || true
          
          # 2. Turn every single defined Android color to pitch black
          find android/app/src/main/res -name "colors.xml" -type f -exec sed -i -E 's/>#[a-fA-F0-9]{6,8}</>#000000</g' {} + || true
          
          # 3. DESTROY the generated image backgrounds that are secretly hiding the gray pixels
          find android/app/src/main/res -name "ic_launcher_background.png" -delete || true
          
          # 4. Create an unchangeable, pure black code-based background
          mkdir -p android/app/src/main/res/drawable
          echo '<?xml version="1.0" encoding="utf-8"?><color xmlns:android="http://schemas.android.com/apk/res/android" android:color="#000000"/>' > android/app/src/main/res/drawable/ic_launcher_background.xml
          
          # 5. Reroute the app icon to use our pure black code instead of the deleted images
          find android/app/src/main/res -name "ic_launcher*.xml" -type f -exec sed -i -E 's/(@mipmap\/ic_launcher_background|@color\/ic_launcher_background)/@drawable\/ic_launcher_background/g' {} + || true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
